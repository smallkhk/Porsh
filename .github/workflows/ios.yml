# Native Swift iOS apps:
#   APEX 9R  (APEXViewer) — SceneKit showroom for iPad/iPhone, landscape
#   APEX Key (APEXKey)    — SwiftUI controller for iPhone, native haptics + QR scanner
# Output (Actions run → Artifacts):
#   APEX-ipa          unsigned .ipa files → install with Sideloadly/AltStore (your Apple ID)
#   APEX-screenshots  simulator screenshots of both apps
name: iOS apps

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: |
          xcodebuild -version
          xcodegen

      - name: Build for devices (unsigned)
        working-directory: ios
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          failed=0
          for s in APEXViewer APEXKey; do
            echo "::group::$s"
            if ! xcodebuild -project APEX.xcodeproj -scheme "$s" -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet build 2>&1 | grep -E "error|warning: unre|BUILD" ; then :; fi
            if [ ! -d "build/device/Build/Products/Release-iphoneos/$s.app" ]; then failed=1; echo "::endgroup::"; continue; fi
            rm -rf Payload && mkdir Payload
            cp -R "build/device/Build/Products/Release-iphoneos/$s.app" Payload/
            zip -qry "$GITHUB_WORKSPACE/out/$s-unsigned.ipa" Payload
            echo "::endgroup::"
          done
          ls -la "$GITHUB_WORKSPACE/out"
          exit $failed

      - uses: actions/upload-artifact@v4
        with:
          name: APEX-ipa
          path: out/*.ipa
          retention-days: 30

      - name: Simulator screenshots
        continue-on-error: true
        working-directory: ios
        run: |
          set -x
          for s in APEXViewer APEXKey; do
            xcodebuild -project APEX.xcodeproj -scheme "$s" -configuration Debug \
              -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim -quiet build
          done
          mkdir -p "$GITHUB_WORKSPACE/shots"
          uuid() { xcrun simctl list devices available | grep -m1 -E "$1" | grep -oE '[0-9A-F-]{36}'; }
          IPAD=$(uuid "iPad Pro 13|iPad Pro \(12.9|iPad Air 13|iPad Pro")
          IPHONE=$(uuid "iPhone 16 Pro \(|iPhone 16 \(|iPhone 15 Pro \(|iPhone")
          echo "iPad=$IPAD iPhone=$IPHONE"
          xcrun simctl boot "$IPAD"; xcrun simctl boot "$IPHONE"
          xcrun simctl bootstatus "$IPAD" -b; xcrun simctl bootstatus "$IPHONE" -b
          xcrun simctl install "$IPAD" build/sim/Build/Products/Debug-iphonesimulator/APEXViewer.app
          xcrun simctl install "$IPHONE" build/sim/Build/Products/Debug-iphonesimulator/APEXKey.app
          shot() { xcrun simctl io "$1" screenshot "$GITHUB_WORKSPACE/shots/$2.png"; }
          xcrun simctl launch "$IPAD" app.apex9r.viewer; sleep 14; shot "$IPAD" viewer-1-locked
          xcrun simctl terminate "$IPAD" app.apex9r.viewer
          xcrun simctl launch "$IPAD" app.apex9r.viewer -demoDoors; sleep 16; shot "$IPAD" viewer-2-doors-lights
          xcrun simctl terminate "$IPAD" app.apex9r.viewer
          xcrun simctl launch "$IPAD" app.apex9r.viewer -demoRev; sleep 9; shot "$IPAD" viewer-3-revving
          xcrun simctl launch "$IPHONE" app.apex9r.key -preview; sleep 6; shot "$IPHONE" key-1-running
          xcrun simctl terminate "$IPHONE" app.apex9r.key
          xcrun simctl launch "$IPHONE" app.apex9r.key; sleep 5; shot "$IPHONE" key-2-pair
          ls -la "$GITHUB_WORKSPACE/shots"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: APEX-screenshots
          path: shots/*.png
          if-no-files-found: ignore
          retention-days: 14
