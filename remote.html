<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>APEX 9R — Key</title>
  <meta name="theme-color" content="#0a0b10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307080b'/%3E%3Cpath d='M7 22 16 8l9 14h-4l-5-8-5 8z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/remote.css" />
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <!-- pairing -->
  <main id="pair" hidden>
    <div class="pair-card">
      <div class="brand">APEX <span>9R</span></div>
      <h1>Pair your key</h1>
      <p>Open the showroom on your computer and scan its QR code, or type the 5-letter code shown under <b>Key</b>.</p>
      <form id="pair-form" autocomplete="off">
        <input id="pair-code" maxlength="5" placeholder="ABCDE" autocapitalize="characters" spellcheck="false" inputmode="text" />
        <button type="submit">Connect</button>
      </form>
    </div>
  </main>

  <!-- key -->
  <main id="key" hidden>
    <header>
      <div class="brand">APEX 9R <small>GT</small></div>
      <div class="conn" id="conn"><i></i><span>Connecting…</span></div>
    </header>

    <section class="readout">
      <h1 id="title">Locked</h1>
      <div class="sub" id="sub"></div>
      <div class="shift" id="shift"></div>
    </section>

    <section class="row4">
      <button class="round" data-cmd="unlock" id="b-unlock"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg><span>Unlock</span></button>
      <button class="round" data-cmd="lock" id="b-lock"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>Lock</span></button>
      <button class="round" data-cmd="doors" id="b-doors"><svg viewBox="0 0 24 24"><path d="M4 20h16M6 20V9l6-5h6v16"/><path d="M14 13h2"/></svg><span>Doors</span></button>
      <button class="round" data-cmd="lights" id="b-lights"><svg viewBox="0 0 24 24"><path d="M10 6c-4 0-6 2.7-6 6s2 6 6 6c1.5 0 2-.8 2-6s-.5-6-2-6Z"/><path d="M15 8h6M15 12h6M15 16h6"/></svg><span id="l-lights">Lights</span></button>
    </section>

    <section class="drive">
      <button class="engine" id="engine">
        <svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" /><circle id="engine-prog" cx="50" cy="50" r="46" /></svg>
        <span class="e1">ENGINE</span><span class="e2">START STOP</span>
      </button>
      <div class="throttle" id="throttle">
        <div class="fill" id="thr-fill"></div>
        <div class="t-label"><b>Throttle</b><span>Hold. Slide up for more.</span></div>
        <div class="t-val" id="thr-val"></div>
      </div>
    </section>

    <button class="launch" id="launch">Launch</button>
    <p class="hint" id="hint">Unlock the car to begin.</p>

    <details class="garage">
      <summary>Garage</summary>
      <div class="g-row"><span>Paint</span><div class="sw" id="sw"></div></div>
      <div class="g-row"><span>Rear wing</span><button class="tog" id="t-wing"></button></div>
      <div class="g-row"><span>Centre stripe</span><button class="tog" id="t-livery"></button></div>
      <div class="g-row"><span>Horn</span><button class="horn" id="horn">Hold</button></div>
    </details>
  </main>

  <script type="module" src="js/remote.js"></script>
</body>
</html>
